name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        # stop before the 6 hour job limit so the step below can still keep the reports
        timeout-minutes: 340
        with:
          pdk: ihp-sg13cmos5l

      - name: Keep the flow reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flow_reports
          path: |
            runs/wokwi/resolved.json
            runs/wokwi/**/*.rpt
            runs/wokwi/**/*.drc
            runs/wokwi/**/*.csv
            runs/wokwi/**/state_out.json
          if-no-files-found: warn
          retention-days: 30

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
