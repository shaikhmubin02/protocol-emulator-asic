# OpenOCD scanning jtag_tap.s on the simulated chip (sim/main.cpp, `pemu_sim jtag`).
#   openocd -f sim/openocd_pemu.cfg
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 3335
transport select jtag
adapter speed 1000

jtag newtap pemu tap -irlen 4 -ircapture 0x1 -irmask 0x3 -expected-id 0x1c0ffee1

init
scan_chain
# USER (IR 1000): write beef, read back what was there (1234 from the host), then beef
irscan pemu.tap 0x8
echo "USER was [drscan pemu.tap 16 0xbeef]"
echo "USER now [drscan pemu.tap 16 0x0000]"
shutdown
